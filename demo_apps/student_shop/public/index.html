<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentShop Demo E-Commerce</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; background: #0f172a; color: #f8fafc; }
        header { background: #1e293b; padding: 1.5rem 2rem; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.5rem; color: #38bdf8; }
        .cart-badge { background: #0284c7; padding: 0.5rem 1rem; border-radius: 9999px; font-weight: bold; }
        main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
        .product-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; text-align: center; }
        .product-icon { font-size: 3rem; margin-bottom: 0.5rem; }
        .product-name { font-weight: 600; font-size: 1.1rem; margin-bottom: 0.5rem; }
        .product-price { color: #38bdf8; font-weight: bold; margin-bottom: 1rem; }
        button { background: #0284c7; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        .cart-panel { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; height: fit-content; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 0; border-bottom: 1px solid #334155; }
        .checkout-btn { width: 100%; margin-top: 1.5rem; padding: 0.8rem; background: #10b981; font-size: 1rem; }
        .checkout-btn:hover { background: #059669; }
        .alert-box { margin-top: 1rem; padding: 1rem; border-radius: 8px; display: none; }
        .alert-error { background: #7f1d1d; border: 1px solid #ef4444; color: #fca5a5; }
        .alert-success { background: #064e3b; border: 1px solid #10b981; color: #6ee7b7; }
    </style>
</head>
<body>
    <header>
        <h1>🛍️ StudentShop</h1>
        <div class="cart-badge" id="cartBadge">Cart: 0 items</div>
    </header>

    <main>
        <section>
            <h2>Available Products</h2>
            <div class="product-grid" id="productGrid">
                <!-- Loaded dynamically -->
            </div>
        </section>

        <aside class="cart-panel">
            <h2>Your Shopping Cart</h2>
            <div id="cartItemsList">
                <p style="color: #94a3b8;">Your cart is empty.</p>
            </div>
            <div style="margin-top: 1rem; font-weight: bold; display: flex; justify-content: space-between;">
                <span>Total:</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn">Proceed to Checkout</button>
            <div id="alertBox" class="alert-box"></div>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
